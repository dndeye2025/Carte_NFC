<style>

/* ============================================================
   ZONE À CONFIGURER — modifie les valeurs dans CONFIG (JS, en bas)
   pour personnaliser toute la carte.
   ============================================================ */

:root{
  --plum-deep:#4a2a1e;
  --plum-panel:#5c3524;
  --plum-line:rgba(255,255,255,.18);
  --gold:#e8bd83;
  --gold-soft:rgba(232,189,131,.18);
  --rose:#f0d2c0;
  --ink:#ffffff;
  --ink-dim:#f0ddd0;
  --radius:22px;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}

body{
  background:
    radial-gradient(120% 90% at 50% -8%, rgba(232,189,131,.20), transparent 55%),
    radial-gradient(90% 70% at 85% 105%, rgba(240,210,192,.14), transparent 60%),
    var(--plum-deep);
  color:var(--ink);
  font-family:'Manrope',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 18px;
  position:relative;
  overflow-x:hidden;
}

/* Grain discret — evoque le papier d'un coffret plutot qu'une trame technique */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:radial-gradient(rgba(246,236,230,.05) 1px, transparent 1px);
  background-size:3px 3px;
  pointer-events:none;
  opacity:.4;
}

.card{
  position:relative;
  width:100%;
  max-width:404px;
  background:linear-gradient(175deg, var(--plum-panel), #3d2015);
  border:1px solid var(--plum-line);
  border-radius:var(--radius);
  padding:44px 30px 30px;
  box-shadow:0 40px 80px -28px rgba(0,0,0,.55);
}

/* ---------- Sceau / identité (signature visuelle) ---------- */
.identity{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding-bottom:28px;
}

.seal-wrap{
  position:relative;
  width:104px;
  height:104px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:20px;
}

/* Aura diffuse qui respire lentement — reference directe a "Aura Essence" */
.aura{
  position:absolute;
  inset:-26px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(232,189,131,.6), rgba(240,210,192,.22) 55%, transparent 72%);
  filter:blur(9px);
  animation:breathe 5.5s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{transform:scale(.92);opacity:.65;}
  50%{transform:scale(1.1);opacity:1;}
}
@media (prefers-reduced-motion: reduce){
  .aura{animation:none;opacity:.8;}
}

.seal{
  position:relative;
  z-index:2;
  width:88px;height:88px;
  border-radius:50%;
  background:linear-gradient(155deg, #6b3e29, #40200f);
  border:1px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;
  font-size:26px;font-weight:560;
  color:var(--gold);
  letter-spacing:.5px;
}
.seal::before{
  content:"";
  position:absolute;
  inset:6px;
  border-radius:50%;
  border:1px solid rgba(202,160,108,.35);
}

.name{
  font-family:'Fraunces',serif;
  font-size:26px;
  font-weight:650;
  letter-spacing:.2px;
  color:var(--ink);
}

.role{
  margin-top:8px;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  letter-spacing:1.8px;
  text-transform:uppercase;
  color:var(--gold);
}

.tagline{
  margin-top:14px;
  font-family:'Fraunces',serif;
  font-style:italic;
  font-weight:500;
  font-size:14.5px;
  line-height:1.55;
  color:var(--ink-dim);
  max-width:290px;
}

/* Divider avec ornement — un point d'essence, pas un numero */
.divider{
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 0 22px;
}
.divider::before,.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--plum-line);
}
.divider .drop{
  width:5px;height:5px;
  border-radius:50%;
  background:var(--gold);
}

/* ---------- Actions de contact ---------- */
.actions{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-bottom:22px;
}

.btn{
  display:flex;
  align-items:center;
  gap:13px;
  width:100%;
  padding:14px 16px;
  border-radius:14px;
  background:rgba(246,236,230,.03);
  border:1px solid var(--plum-line);
  color:var(--ink);
  text-decoration:none;
  font-size:14.5px;
  font-weight:500;
  transition:border-color .18s ease, background .18s ease, transform .18s ease;
}
.btn:hover{border-color:var(--gold);background:var(--gold-soft);transform:translateY(-1px);}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

.btn .ico{
  flex:none;
  width:34px;height:34px;
  border-radius:50%;
  background:var(--gold-soft);
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);
}
.btn .lbl small{
  display:block;
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px;
  letter-spacing:1.2px;
  color:var(--ink-dim);
  text-transform:uppercase;
  margin-bottom:3px;
}

/* ---------- Réseaux ---------- */
.socials{
  display:flex;
  justify-content:center;
  gap:12px;
  padding-bottom:24px;
}
.social{
  width:42px;height:42px;
  border-radius:50%;
  background:rgba(246,236,230,.03);
  border:1px solid var(--plum-line);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-dim);
  text-decoration:none;
  transition:border-color .18s ease, color .18s ease, transform .18s ease;
}
.social:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px);}

/* ---------- Bouton principal : enregistrer le contact ---------- */
.save-btn{
  width:100%;
  padding:16px 16px;
  border:1px solid var(--gold);
  border-radius:14px;
  background:linear-gradient(135deg, var(--gold), #b8823f);
  color:#2c1608;
  font-family:'Manrope',sans-serif;
  font-size:14.5px;
  font-weight:700;
  letter-spacing:.3px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  cursor:pointer;
  transition:filter .18s ease, transform .18s ease;
}
.save-btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
.save-btn:active{transform:translateY(0);}
.save-btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}

.save-note{
  text-align:center;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:.6px;
  color:var(--ink-dim);
  margin-top:11px;
}

/* ---------- Pied ---------- */
.footer{
  margin-top:26px;
  padding-top:18px;
  border-top:1px solid var(--plum-line);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--ink-dim);
}
.footer .drop{width:5px;height:5px;border-radius:50%;background:var(--gold);}

svg{display:block;}
</style>
</head>

<script>
/* ============================================================
   CONFIGURATION — modifie uniquement les valeurs ci-dessous.
   Le reste de la page se met à jour automatiquement.
   ============================================================ */
const CONFIG = {
  initials:   "NMD",
  fullName:   "Ndeye Mareme Diop",
  role:       "Étudiante · Statistique & Informatique Décisionnelle",
  tagline:    "Data Science, Big Data & Power BI — Fondatrice & PDG d'Aura Essence, Dakar",
  phone:      "+221781129602",      // format international, sans espaces
  phoneDisplay: "+221 78 112 96 02",
  email:      "diopndeyemareme727@gmail.com",
  whatsapp:   "221781129602",       // sans le +
  linkedin:   "https://www.linkedin.com/in/ndeye-mareme-diop-631942228",
  tiktok:     "https://www.tiktok.com/@auraessence.sn",
  snapchat:   "https://snapchat.com/t/X262yd6q",
  city:       "Dakar, Sénégal",
  org:        "Aura Essence"                    // ex: "Nom de ton entreprise" (optionnel)
};

function applyConfig(c){
  document.getElementById('avatarInitials').textContent = c.initials;
  document.getElementById('fullName').textContent = c.fullName;
  document.getElementById('roleLabel').textContent = c.role;
  document.getElementById('tagline').textContent = c.tagline;

  document.getElementById('callBtn').href = 'tel:' + c.phone;
  document.getElementById('callBtn').querySelector('.lbl').innerHTML = '<small>Téléphone</small>' + c.phoneDisplay;

  document.getElementById('emailBtn').href = 'mailto:' + c.email;
  document.getElementById('emailBtn').querySelector('.lbl').innerHTML = '<small>Email</small>' + c.email;

  document.getElementById('waBtn').href = 'https://wa.me/' + c.whatsapp;

  document.getElementById('linkedinLink').href = c.linkedin;
  document.getElementById('tiktokLink').href = c.tiktok;
  document.getElementById('snapLink').href = c.snapchat;

  document.title = c.fullName + ' — Contact';
}
applyConfig(CONFIG);

/* Génère et télécharge un fichier vCard (.vcf) à partir de CONFIG */
function downloadVCard(c){
  const lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'N:' + c.fullName.split(' ').reverse().join(';'),
    'FN:' + c.fullName,
    c.org ? 'ORG:' + c.org : '',
    'TITLE:' + c.role,
    'TEL;TYPE=CELL:' + c.phone,
    'EMAIL:' + c.email,
    'URL:' + c.linkedin,
    'ADR;TYPE=WORK:;;' + c.city + ';;;;',
    'END:VCARD'
  ].filter(Boolean).join('\r\n');

  const blob = new Blob([lines], {type:'text/vcard'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = c.fullName.replace(/\s+/g,'_') + '.vcf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('saveBtn').addEventListener('click', () => downloadVCard(CONFIG));
</script>
